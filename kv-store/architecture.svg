<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Key–Value Store — the 60-second path</title>
  <desc id="description">A concise learning diagram showing routing context, client request, coordinator, deterministic replica placement, quorum, versions, hinted handoff, read repair, and anti-entropy.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d9d5ca" opacity="0.42"/></pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17212b" flood-opacity="0.08"/></filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c66a12"/></marker>
    <style>text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }</style>
  </defs>
  <rect width="1440" height="900" fill="#f7f4ec"/>
  <rect width="1440" height="900" fill="url(#grid)"/>
  <text x="52" y="64" font-size="34" font-weight="760" fill="#17212b" text-anchor="start"><tspan x="52" dy="0">Key–Value Store · the 60-second path</tspan></text>
  <text x="54" y="96" font-size="16" font-weight="500" fill="#5d6974" text-anchor="start"><tspan x="54" dy="0">One request, deterministic placement, a quorum, and the repair path when replicas diverge.</tspan></text>

  <rect x="42" y="118" width="1356" height="116" rx="18" fill="#fbfaf6" stroke="#c9c6bc"/>
  <text x="58" y="141" font-size="12" font-weight="700" fill="#5d6974" text-anchor="start"><tspan x="58" dy="0">ROUTING CONTEXT</tspan></text>

    <g>
      <rect x="58" y="154" width="178" height="62" rx="12" fill="#ffffff" stroke="#c9c6bc" stroke-width="1.25"/>
      <text x="147" y="177" font-size="16" font-weight="700" fill="#17212b" text-anchor="middle"><tspan x="147" dy="0">Global</tspan></text>
      <text x="147" y="201" font-size="11" font-weight="500" fill="#5d6974" text-anchor="middle"><tspan x="147" dy="0">DNS · infra</tspan></text>
    </g><path d="M 241 185 L 261 185" fill="none" stroke="#2563eb" stroke-width="2.5"  marker-end="url(#arrow-blue)"/>
    <g>
      <rect x="266" y="154" width="178" height="62" rx="12" fill="#ffffff" stroke="#c9c6bc" stroke-width="1.25"/>
      <text x="355" y="177" font-size="16" font-weight="700" fill="#17212b" text-anchor="middle"><tspan x="355" dy="0">Edge</tspan></text>
      <text x="355" y="201" font-size="11" font-weight="500" fill="#5d6974" text-anchor="middle"><tspan x="355" dy="0">CDN · infra</tspan></text>
    </g><path d="M 449 185 L 469 185" fill="none" stroke="#2563eb" stroke-width="2.5"  marker-end="url(#arrow-blue)"/>
    <g>
      <rect x="474" y="154" width="196" height="62" rx="12" fill="#ffffff" stroke="#c9c6bc" stroke-width="1.25"/>
      <text x="572" y="177" font-size="16" font-weight="700" fill="#17212b" text-anchor="middle"><tspan x="572" dy="0">Cluster</tspan></text>
      <text x="572" y="201" font-size="11" font-weight="500" fill="#5d6974" text-anchor="middle"><tspan x="572" dy="0">load balancer · infra</tspan></text>
    </g><path d="M 675 185 L 695 185" fill="none" stroke="#2563eb" stroke-width="2.5"  marker-end="url(#arrow-blue)"/>
    <g>
      <rect x="700" y="154" width="190" height="62" rx="12" fill="#ffffff" stroke="#c9c6bc" stroke-width="1.25"/>
      <text x="795" y="177" font-size="16" font-weight="700" fill="#17212b" text-anchor="middle"><tspan x="795" dy="0">Service</tspan></text>
      <text x="795" y="201" font-size="11" font-weight="500" fill="#5d6974" text-anchor="middle"><tspan x="795" dy="0">API gateway · you</tspan></text>
    </g><path d="M 895 185 L 915 185" fill="none" stroke="#2563eb" stroke-width="2.5"  marker-end="url(#arrow-blue)"/>
    <g>
      <rect x="920" y="154" width="190" height="62" rx="12" fill="#ffffff" stroke="#c9c6bc" stroke-width="1.25"/>
      <text x="1015" y="177" font-size="16" font-weight="700" fill="#17212b" text-anchor="middle"><tspan x="1015" dy="0">Application</tspan></text>
      <text x="1015" y="201" font-size="11" font-weight="500" fill="#5d6974" text-anchor="middle"><tspan x="1015" dy="0">KV endpoint · you</tspan></text>
    </g><path d="M 1115 185 L 1135 185" fill="none" stroke="#2563eb" stroke-width="2.5"  marker-end="url(#arrow-blue)"/>
    <g>
      <rect x="1140" y="154" width="180" height="62" rx="12" fill="#ffe9e5" stroke="#dc4f45" stroke-width="2"/>
      <text x="1230" y="177" font-size="16" font-weight="700" fill="#dc4f45" text-anchor="middle"><tspan x="1230" dy="0">Data</tspan></text>
      <text x="1230" y="201" font-size="11" font-weight="500" fill="#5d6974" text-anchor="middle"><tspan x="1230" dy="0">hash placement · KV</tspan></text>
    </g>


  <g>
    <rect x="54" y="354" width="176" height="118" rx="15" fill="#17212b" opacity="0.07"/>
    <rect x="54" y="350" width="176" height="118" rx="15" fill="#e7efff" stroke="#2563eb" stroke-width="2"/>
    <text x="72" y="379" font-size="20" font-weight="700" fill="#2563eb" text-anchor="start"><tspan x="72" dy="0">Client</tspan></text>
    <text x="72" y="416" font-size="15" font-weight="500" fill="#17212b" text-anchor="start"><tspan x="72" dy="0">GET(key)</tspan><tspan x="72" dy="24">or PUT(key, value)</tspan></text>
  </g>

  <g>
    <rect x="302" y="278" width="330" height="302" rx="15" fill="#17212b" opacity="0.07"/>
    <rect x="302" y="274" width="330" height="302" rx="15" fill="#f0eaff" stroke="#7c3aed" stroke-width="2"/>
    <text x="320" y="303" font-size="21" font-weight="700" fill="#7c3aed" text-anchor="start"><tspan x="320" dy="0">Coordinator · per request</tspan></text>
    <text x="320" y="340" font-size="17" font-weight="500" fill="#17212b" text-anchor="start"><tspan x="320" dy="0">1  Validate GET / PUT</tspan><tspan x="320" dy="27.200000000000003">2  Hash key → token</tspan><tspan x="320" dy="27.200000000000003">3  Choose N distinct nodes</tspan><tspan x="320" dy="27.200000000000003">4  Wait for R responses or</tspan><tspan x="320" dy="27.200000000000003">    W acknowledgments</tspan></text>
  </g>

  <g>
    <rect x="710" y="284" width="258" height="112" rx="15" fill="#17212b" opacity="0.07"/>
    <rect x="710" y="280" width="258" height="112" rx="15" fill="#ffe9e5" stroke="#dc4f45" stroke-width="2"/>
    <text x="728" y="309" font-size="18" font-weight="700" fill="#dc4f45" text-anchor="start"><tspan x="728" dy="0">Deterministic placement</tspan></text>
    <text x="728" y="346" font-size="15" font-weight="500" fill="#17212b" text-anchor="start"><tspan x="728" dy="0">hash(key) → token</tspan><tspan x="728" dy="24">replica set → [B, C, D]</tspan></text>
  </g>

  <g>
    <rect x="710" y="442" width="258" height="138" rx="15" fill="#17212b" opacity="0.07"/>
    <rect x="710" y="438" width="258" height="138" rx="15" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="728" y="467" font-size="18" font-weight="700" fill="#7c3aed" text-anchor="start"><tspan x="728" dy="0">Compare versions</tspan></text>
    <text x="728" y="504" font-size="14" font-weight="500" fill="#17212b" text-anchor="start"><tspan x="728" dy="0">newer dominates stale</tspan><tspan x="728" dy="22.400000000000002">concurrent writes → siblings</tspan><tspan x="728" dy="22.400000000000002">repair after the read</tspan></text>
  </g>

  <g>
    <rect x="1050" y="274" width="276" height="94" rx="15" fill="#17212b" opacity="0.07"/>
    <rect x="1050" y="270" width="276" height="94" rx="15" fill="#e8f6ec" stroke="#15803d" stroke-width="2"/>
    <text x="1068" y="299" font-size="19" font-weight="700" fill="#15803d" text-anchor="start"><tspan x="1068" dy="0">Replica B</tspan></text>
    <text x="1068" y="336" font-size="14" font-weight="500" fill="#17212b" text-anchor="start"><tspan x="1068" dy="0">value + version metadata</tspan></text>
  </g>
  <g>
    <rect x="1050" y="397" width="276" height="94" rx="15" fill="#17212b" opacity="0.07"/>
    <rect x="1050" y="393" width="276" height="94" rx="15" fill="#e8f6ec" stroke="#15803d" stroke-width="2"/>
    <text x="1068" y="422" font-size="19" font-weight="700" fill="#15803d" text-anchor="start"><tspan x="1068" dy="0">Replica C</tspan></text>
    <text x="1068" y="459" font-size="14" font-weight="500" fill="#17212b" text-anchor="start"><tspan x="1068" dy="0">value + version metadata</tspan></text>
  </g>
  <g>
    <rect x="1050" y="520" width="276" height="94" rx="15" fill="#17212b" opacity="0.07"/>
    <rect x="1050" y="516" width="276" height="94" rx="15" fill="#fff7f5" stroke="#dc4f45" stroke-width="2"/>
    <text x="1068" y="545" font-size="19" font-weight="700" fill="#dc4f45" text-anchor="start"><tspan x="1068" dy="0">Replica D</tspan></text>
    <text x="1068" y="582" font-size="14" font-weight="500" fill="#17212b" text-anchor="start"><tspan x="1068" dy="0">value + version metadata</tspan></text>
  </g>

  <path d="M 238 408 L 294 408" fill="none" stroke="#2563eb" stroke-width="2.5"  marker-end="url(#arrow-blue)"/>
  <text x="266" y="390" font-size="12" font-weight="650" fill="#2563eb" text-anchor="middle"><tspan x="266" dy="0">request</tspan></text>
  <path d="M 640 336 L 702 336" fill="none" stroke="#2563eb" stroke-width="2.5"  marker-end="url(#arrow-blue)"/>
  <text x="671" y="318" font-size="12" font-weight="650" fill="#2563eb" text-anchor="middle"><tspan x="671" dy="0">route</tspan></text>
  <path d="M 976 336 L 1042 317" fill="none" stroke="#2563eb" stroke-width="2.5"  marker-end="url(#arrow-blue)"/>
  <path d="M 976 336 L 1042 440" fill="none" stroke="#2563eb" stroke-width="2.5"  marker-end="url(#arrow-blue)"/>
  <path d="M 976 336 L 1042 563" fill="none" stroke="#2563eb" stroke-width="2.5"  marker-end="url(#arrow-blue)"/>
  <path d="M 1040 610 L 645 602" fill="none" stroke="#15803d" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-green)"/>
  <path d="M 294 515 L 236 472" fill="none" stroke="#15803d" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-green)"/>
  <text x="832" y="595" font-size="13" font-weight="650" fill="#15803d" text-anchor="middle"><tspan x="832" dy="0">reply after quorum · background repair may continue</tspan></text>

  <rect x="990" y="632" width="348" height="54" rx="14" fill="#e8f6ec" stroke="#15803d" stroke-width="2"/>
  <text x="1164" y="665" font-size="12" font-weight="760" fill="#15803d" text-anchor="middle"><tspan x="1164" dy="0">N = 3 · R = 2 responses · W = 2 acknowledgments</tspan></text>

  <rect x="42" y="710" width="1356" height="116" rx="18" fill="#fff0d7" stroke="#c66a12" stroke-width="1.5"/>
  <text x="60" y="739" font-size="12" font-weight="760" fill="#c66a12" text-anchor="start"><tspan x="60" dy="0">TEMPORARY DIVERGENCE</tspan></text>
  <text x="62" y="780" font-size="16" font-weight="650" fill="#17212b" text-anchor="start"><tspan x="62" dy="0">1  Preferred D unavailable</tspan></text>
  <path d="M 312 770 L 385 770" fill="none" stroke="#c66a12" stroke-width="2.5"  marker-end="url(#arrow-amber)"/>
  <text x="402" y="764" font-size="16" font-weight="650" fill="#17212b" text-anchor="start"><tspan x="402" dy="0">2  Temporary E accepts copy</tspan><tspan x="402" dy="23.2">    + stores hint for D</tspan></text>
  <path d="M 699 770 L 772 770" fill="none" stroke="#c66a12" stroke-width="2.5"  marker-end="url(#arrow-amber)"/>
  <text x="790" y="780" font-size="16" font-weight="650" fill="#17212b" text-anchor="start"><tspan x="790" dy="0">3  Replay hint when D heals</tspan></text>
  <path d="M 1055 770 L 1128 770" fill="none" stroke="#c66a12" stroke-width="2.5"  marker-end="url(#arrow-amber)"/>
  <text x="1145" y="764" font-size="16" font-weight="650" fill="#17212b" text-anchor="start"><tspan x="1145" dy="0">4  Read repair +</tspan><tspan x="1145" dy="23.2">    anti-entropy converge</tspan></text>

  <text x="48" y="871" font-size="13" font-weight="550" fill="#5d6974" text-anchor="start"><tspan x="48" dy="0">Invariant: the same membership snapshot maps a key to the same replica set.</tspan></text>
  <text x="1392" y="871" font-size="13" font-weight="650" fill="#dc4f45" text-anchor="end"><tspan x="1392" dy="0">R + W &gt; N gives overlap; alone it does not guarantee linearizability.</tspan></text>
</svg>
